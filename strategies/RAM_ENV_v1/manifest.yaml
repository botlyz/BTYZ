family: RAM_ENV
version: 1
data_source: lighter
tf: 3m
screen_tfs: [1m, 3m, 5m]
free_params: [ma_window, env_pct]
grid:
  ma_window: [50, 200]
  env_pct: [0.03, 0.05, 0.08]
notes: >
  Retour à la moyenne par enveloppe SMA, long+short symétrique, sortie au retour
  à la MA, stop de protection fixe 15%. Screené sur toutes les timeframes Lighter.
